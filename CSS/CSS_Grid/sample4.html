<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: grid;
            grid-template-columns: auto auto auto;
            background-color: dodgerblue;
            padding: 5px;
            gap: 5px;
        }

        .container div {
            background-color: #f1f1f1;
            color: #000;
            padding: 10px;
            font-size: 30px;
            text-align: center;
        }

        /* .item1{

    </style>
</head>

<body>

    <h1>Grid Items</h1>

    <p>A grid container contains one or more grid items arranged in columns and rows.</p>
    <p>All direct child elements of a grid container automatically become grid items.</p>

    <div class="container">
        <div class="item1">1</div>
        <div>2</div>
        <div>3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
    </div>

</body>
