<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 70%;
            margin: auto;
        }
        #updateButton{
            display: none;
        }
    </style>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Student Name</th>
                <th>Age</th>
                <th>Class</th>
                <th>City</th>
                <th>Delete</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            <tr>

            </tr>
        </tbody>
    </table>
    <form>
        <h2>Student Form</h2>
        <label for="name">ID:</label>
        <input type="text" id="id" name="name" placeholder="Enter student name" />

        <br /><br />

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter student name" />

        <br /><br />

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age" />

        <br /><br />

        <label for="class">Class:</label>
        <input type="text" id="class" name="class" placeholder="Enter class" />

        <br /><br />

        <label for="city">City:</label>
        <input type="text" id="city" name="city" placeholder="Enter city" />

        <br /><br />

        <button type="button" onclick="addStudent()" id="addButton">Add Student</button>
        <button type="button" onclick="updateStudent()" id="updateButton">Update Student</button>
    </form>
    <script>
        // C - Create 
        // R - Read 
        // U - Update 
        // D - Delete

        var students = [
            {
                id: 1,
                name: "Aarav Sharma",
                age: 20,
                class: "B.Tech CSE",
                city: "Bengaluru"
            },
            {
                id: 2,
                name: "Priya Reddy",
                age: 19,
                class: "B.Tech AI & ML",
                city: "Hyderabad"
            },
            {
                id: 3,
                name: "Rahul Kumar",
                age: 21,
                class: "B.Tech ECE",
                city: "Chennai"
            },
            {
                id: 4,
                name: "Sneha Patel",
                age: 20,
                class: "B.Tech IT",
                city: "Pune"
            },
            {
                id: 5,
                name: "Arjun Mehta",
                age: 19,
                class: "BCA",
                city: "Mumbai"
            }
        ];

        function displayStudents() {
            document.querySelector("tbody").innerHTML = "";

            students.forEach(function (student, i) {

                var myTr = document.createElement("tr")
                myTr.innerHTML = `
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.age}</td>
            <td>${student.class}</td>
            <td>${student.city}</td>
            <td><button onclick="handleDelete(${i})">Delete Student</button></td>
            <td><button onclick="handleEdit(${i})">Edit Student</button></td>
        `
                document.querySelector("tbody").appendChild(myTr)
            })
        }

        displayStudents();

        function handleDelete(index) {
            students.splice(index, 1) // one student got deleted 
            displayStudents();
        }

        function clearFormFields() {
            document.getElementById("id").value = "";
            document.getElementById("name").value = "";
            document.getElementById("age").value = "";
            document.getElementById("class").value = "";
            document.getElementById("city").value = ""
        }
        function addStudent() {
            var student = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                age: document.getElementById("age").value,
                class: document.getElementById("class").value,
                city: document.getElementById("city").value
            }
            students.push(student);
            displayStudents();
            clearFormFields();
        }

        var editIndex = null;

        function handleEdit(index) {
            editIndex = index;
            console.log(students[editIndex]);
            document.getElementById("id").value = students[editIndex].id
            document.getElementById("name").value = students[editIndex].name
            document.getElementById("age").value = students[editIndex].age
            document.getElementById("class").value = students[editIndex].class
            document.getElementById("city").value = students[editIndex].city

            document.getElementById("updateButton").style.display="block"
            document.getElementById("addButton").style.display="none"
        }

        function updateStudent(){
              var student = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                age: document.getElementById("age").value,
                class: document.getElementById("class").value,
                city: document.getElementById("city").value
            }

            students[editIndex] = student;
            displayStudents();
            clearFormFields();
             document.getElementById("updateButton").style.display="none"
            document.getElementById("addButton").style.display="block"
        }
    </script>
</body>


</html>
