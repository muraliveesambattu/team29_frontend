<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            width: 80%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>UserName</th>
                <th>Phone</th>
                <th>Website</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <script>

       fetch("https://jsonplaceholder.typicode.com/users").then(function (nisar){
        return nisar.json()
       }).then(function (data){
        displayData(data)
       })

       function displayData(data){
        data.forEach(function (user){
            console.log(user);
            var myTr = document.createElement("tr");
            myTr.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.username}</td>
                        <td>${user.phone}</td>
                        <td>${user.website}</td>
            `
            document.querySelector("tbody").appendChild(myTr)
        })
       }
        // 1. To get the data from An API , We can use fetch . 
        // 2. Fetch will give us RawData in step 1 
        // 3. Fetch will give us Actual JSON in Step 2 
    </script>
</body>
</html>
