<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 80%;
            margin: 0 auto;
        }

        #updateButton {
            display: none;
        }
    </style>
</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>UserName</th>
                <th>Phone</th>
                <th>Website</th>
                <th>Delete</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
    <form>
        <label for="id">ID:</label>
        <input type="number" id="id" name="id"> <br><br>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"> <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"> <br><br>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username"> <br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>
        <label for="website">Website:</label>
        <input type="url" id="website" name="website"> <br><br>
        <button type="button" onclick="addUser()" id="addButton">Submit</button>
        <button type="button" onclick="updateUser()" id="updateButton">Update</button>
    </form>
    <script>
        var users = []
        function getDataFromServer() {
            fetch("http://localhost:3000/users").then(function (response) {
                return response.json()
            }).then(function (data) {
                // users = data;
                displayUsers(data);
            })
        }

        function displayUsers(data) {
            document.querySelector("tbody").innerHTML = ""
            data.forEach(function (user, index) {
                console.log(user);
                var myTr = document.createElement("tr");
                myTr.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.username}</td>
                        <td>${user.phone}</td>
                        <td>${user.website}</td>
                        <td><button onclick="handleDelete('${user.id}')">Delete</button></td>
                        <td><button onclick="handleEdit('${user.id}')">Edit</button>
                            </td>
            `
                document.querySelector("tbody").appendChild(myTr)
            })
        }
        getDataFromServer();

        function handleDelete(id) {

            fetch("http://localhost:3000/users/" + id, {
                method: "DELETE"
            }).then(function () {
                getDataFromServer();
            })

        }

        function addUser() {
            var user = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                username: document.getElementById("username").value,
                phone: document.getElementById("phone").value,
                website: document.getElementById("website").value,
            }

            // console.log(user);

            fetch("http://localhost:3000/users", {
                method: "POST",
                body: JSON.stringify(user),
                headers: {
                    "Content-Type": "application/json"
                }

            }).then(function () {
                getDataFromServer()
            })
        }

        function handleEdit(id) {
            fetch("http://localhost:3000/users/" + id).then(function (response) {
                return response.json()
            }).then(function (user) {
                document.getElementById("id").value = user.id
                document.getElementById("name").value = user.name
                document.getElementById("email").value = user.email
                document.getElementById("username").value = user.username
                document.getElementById("phone").value = user.phone
                document.getElementById("website").value = user.website
            })

            document.getElementById("addButton").style.display = "none";
            document.getElementById("updateButton").style.display = "block";

        }

        function updateUser() {
            var user = {
                id: document.getElementById("id").value,
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                username: document.getElementById("username").value,
                phone: document.getElementById("phone").value,
                website: document.getElementById("website").value,
            }

            fetch("http://localhost:3000/users/" + user.id, {
                method: "PUT",
                body: JSON.stringify(user),
                headers: {
                    "Content-Type": "application/json"
                }
            }).then(function(){
                getDataFromServer()
            })

        }
    </script>
</body>

</html>
